<div class="min-h-dvh bg-cream">
  <header class="sticky top-0 z-10 border-b border-ink/5 bg-cream/80 backdrop-blur">
    <div class="mx-auto flex max-w-lg items-center justify-between px-4 py-3">
      <span class="text-lg font-extrabold tracking-tight text-ink">
        Haushalts<span class="ml-0.5 inline-block -rotate-6 rounded-md bg-primary px-1.5 py-0.5 text-sm text-white">OS</span>
      </span>
      <!-- Navigation im Header nur auf größeren Screens, auf Mobil übernimmt die Tab-Leiste -->
      <nav class="hidden items-center gap-1 md:flex">
        <a routerLink="/dashboard"
           routerLinkActive=""
           ariaCurrentWhenActive="page"
           class="rounded-full px-3 py-1.5 text-sm font-semibold text-ink-soft transition hover:bg-primary-soft hover:text-primary aria-[current=page]:bg-primary-soft aria-[current=page]:text-primary">Dashboard</a>
        <a routerLink="/einkauf"
           routerLinkActive=""
           ariaCurrentWhenActive="page"
           class="rounded-full px-3 py-1.5 text-sm font-semibold text-ink-soft transition hover:bg-primary-soft hover:text-primary aria-[current=page]:bg-primary-soft aria-[current=page]:text-primary">Einkaufsliste</a>
      </nav>
      <app-button variant="ghost" (click)="logout()">Abmelden</app-button>
    </div>
  </header>
  <main class="mx-auto max-w-lg p-4 pb-24 md:pb-4">
    <router-outlet />
  </main>

  <!-- Untere Tab-Leiste auf Mobil -->
  <nav class="fixed inset-x-0 bottom-0 z-10 border-t border-ink/5 bg-cream/90 pb-[env(safe-area-inset-bottom)] backdrop-blur md:hidden">
    <div class="mx-auto flex max-w-lg">
      <a routerLink="/dashboard"
         routerLinkActive=""
         ariaCurrentWhenActive="page"
         class="flex flex-1 flex-col items-center gap-0.5 py-2 text-xs font-semibold text-ink-soft transition aria-[current=page]:text-primary">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="size-6" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        Dashboard
      </a>
      <a routerLink="/einkauf"
         routerLinkActive=""
         ariaCurrentWhenActive="page"
         class="flex flex-1 flex-col items-center gap-0.5 py-2 text-xs font-semibold text-ink-soft transition aria-[current=page]:text-primary">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="size-6" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
        </svg>
        Einkaufsliste
      </a>
    </div>
  </nav>
</div>
